name: Device browser engines
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  device:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            project: edge
          - os: macos-latest
            project: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.project == 'webkit'
        run: pnpm exec playwright install webkit
      - run: pnpm exec playwright test --config playwright.device-engines.config.mjs --project ${{ matrix.project }}
