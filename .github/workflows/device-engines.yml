name: Device browser engines
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [codex/road-to-complete-security-triage]
permissions:
  contents: read
jobs:
  device:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            project: edge
          - os: macos-latest
            project: webkit
          - os: ubuntu-24.04
            project: firefox
          - os: ubuntu-24.04
            project: chrome
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.project == 'webkit'
        run: pnpm exec playwright install webkit
      - if: matrix.project == 'firefox'
        run: pnpm exec playwright install --with-deps firefox
      - if: matrix.project == 'chrome'
        run: pnpm exec playwright install --with-deps chrome
      - name: Record actual engine and platform identity
        run: node scripts/browser-engine-metadata.mjs ${{ matrix.project }}
      - name: Exercise selected local ledger and account boundaries
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/release-v19/device-${{ matrix.project }}-results.json
        run: pnpm exec playwright test --config playwright.device-engines.config.mjs --project ${{ matrix.project }} --reporter=line,json --output artifacts/release-v19/device-${{ matrix.project }}-output
      - name: Retain exact-engine test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tallybook-engine-${{ matrix.project }}-${{ github.run_id }}
          path: |
            artifacts/release-v19/device-${{ matrix.project }}-metadata.json
            artifacts/release-v19/device-${{ matrix.project }}-results.json
            artifacts/release-v19/device-${{ matrix.project }}-output/**
          retention-days: 14
          if-no-files-found: warn
