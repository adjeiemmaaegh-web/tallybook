name: UI branch verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/premium-beginner-home-clementia]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Unit and integration tests
        run: pnpm test
      - name: Production build (verification only; no deployment)
        run: pnpm build
      - name: Install Chromium for visual evidence
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture desktop and mobile UI evidence
        run: pnpm exec playwright test --config playwright.visual.config.mjs
      - name: Upload UI screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-ui-visual-evidence
          path: artifacts/ui-visual/
          if-no-files-found: warn
