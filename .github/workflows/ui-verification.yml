name: UI branch verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/premium-beginner-home-clementia]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Unit and integration tests
        run: pnpm test
      - name: Production build (verification only; no deployment)
        run: pnpm build
