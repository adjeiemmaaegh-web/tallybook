name: Release validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p artifacts/release-v19
      - name: Client integration tests
        run: set -o pipefail; pnpm test --maxWorkers=2 2>&1 | tee artifacts/release-v19/client-ci.log
      - name: Node, filesystem security and TLS integration tests
        if: always()
        run: set -o pipefail; node --experimental-strip-types --test scripts/historical-costing-check.mjs qa/*.test.mjs qa/*.test.cjs server/tests/*.test.mjs 2>&1 | tee artifacts/release-v19/node-ci.log
      - name: Semantic types
        if: always()
        run: set -o pipefail; pnpm check 2>&1 | tee artifacts/release-v19/types-ci.log
      - name: Production build
        if: always()
        run: set -o pipefail; pnpm build 2>&1 | tee artifacts/release-v19/build-ci.log
      - name: Browser installation
        run: pnpm exec playwright install --with-deps chromium
      - name: Native IndexedDB migrations and setup
        run: set -o pipefail; pnpm exec playwright test 2>&1 | tee artifacts/release-v19/browser-ci.log
      - name: Offline production checkout
        run: set -o pipefail; pnpm exec playwright test --config playwright.offline.config.mjs 2>&1 | tee artifacts/release-v19/offline-ci.log
      - name: Dependency vulnerabilities
        run: pnpm audit --audit-level moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation-logs
          path: artifacts/release-v19/*-ci.log
